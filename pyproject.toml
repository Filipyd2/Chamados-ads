[project]
name = "Chamados-ads"
version = "0.1.0"
description = "API REST para gerenciamento de chamados de suporte técnico - ADS"
readme = "README.md"
authors = [
    { name = "Luiz Filipy Soares da Silva", email = "luiz.filipy@aluno.ufca.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
chamados-ads = "chamados_ads:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
